[package]
name = "arm7tdmi"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rustboyadvance-utils = {"path" = "../utils" }
log = "0.4.8"
bit = "0.1.1"
cfg-if = "1.0.0"
serde = { version = "1.0.104", features = ["derive", "rc"] }
ansi_term = "0.12.1"
colored = "3.0.0"
byteorder = "1"
num = "0.4.3"
num-traits = "0.2"
enum-primitive-derive = "0.3.0"
gdbstub = "0.7.7"
gdbstub_arch = "0.3.2"
rustc-hash = "2"

[dev-dependencies]
simple_logger = "5.0.0"  # For the examples

[build-dependencies]
bit = "0.1.1"

[features]
debugger = []
# Enables a block-granular cached interpreter: decoded instructions and resolved
# handler fn pointers are memoized by entry-PC, removing the LUT hash + single_step
# wrapper overhead from the hot path. Accuracy is preserved — the scheduler still
# sees per-memory-access cycle advancement as it does today.
cached_interp = []
# Enables the Cranelift-based ARM→native-code dynarec. Extends cached_interp
# with a codegen backend that compiles hot ARM data-processing instructions to
# host machine code. Cranelift is a heavy dep, so gate strictly behind this
# feature; the default build is unchanged.
dynarec = ["cached_interp", "dep:cranelift", "dep:cranelift-module", "dep:cranelift-jit", "dep:cranelift-native"]
# LLVM-via-inkwell backend, side-by-side with Cranelift. Goal: better
# per-instruction codegen quality (rustc parity since LLVM is rustcs
# backend), in exchange for slower compile time. Implies cached_interp.
# Currently a proof-of-concept — not all Thumb formats are wired up yet.
dynarec_llvm = ["cached_interp", "dep:inkwell"]
# Enables the Cranelift-disasm dump helper (arm7tdmi::dynarec::dump) for
# the shape-optimization research loop. Implies dynarec. Pulls in capstone
# for arm64 disassembly.
dynarec_asm_dump = ["dynarec", "dep:capstone"]
# Enables the criterion-based per-shape micro-bench (benches/dynarec_shapes.rs).
# Implies dynarec.
bench = ["dynarec", "dep:criterion"]
# One-shot shape frequency profile counter installed in BlockCache::finish_record.
# Off by default; scripts/dynarec_measure.sh turns it on for a single profile
# pass, then rebuilds without it.
shape_profile = ["dynarec"]

[dependencies.cranelift]
version = "0.122"
optional = true

[dependencies.cranelift-module]
version = "0.122"
optional = true

[dependencies.cranelift-jit]
version = "0.122"
optional = true

[dependencies.cranelift-native]
version = "0.122"
optional = true

[dependencies.inkwell]
version = "0.9"
features = ["llvm18-1-prefer-dynamic"]
optional = true

[dependencies.capstone]
version = "0.12"
optional = true

[dependencies.criterion]
version = "0.5"
optional = true
default-features = false

[[bench]]
name = "dynarec_shapes"
harness = false
required-features = ["bench"]
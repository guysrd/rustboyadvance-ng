[package]
name = "rustboyadvance-sdl2"
version = "0.1.0"
authors = ["Michel Heily <michelheily@gmail.com>"]
edition = "2024"

[dependencies]
rustboyadvance-core = { path = "../../core/", features = ["elf_support"] }
rustboyadvance-utils = { path = "../../utils/" }
sdl2 = { version = "0.38.0", features = ["image"] }
bytesize = "2.0.1"
clap = { version = "4.5.46", features = ["derive"] }
log = "0.4.8"
flexi_logger = { version = "0.31.2", features = ["colors"] }
bit = "^0.1"
spin_sleep = "1.3.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[features]
default = []
debugger = ["rustboyadvance-core/debugger"]
# Pass-through so `cargo build -p rustboyadvance-sdl2 --features dynarec`
# exercises the Cranelift dynarec path. Used by the shape-opt measure
# harness (scripts/dynarec_measure.sh) to time the SDL frontend against
# real ROMs.
cached_interp = ["rustboyadvance-core/cached_interp"]
dynarec = ["rustboyadvance-core/dynarec"]
# LLVM-via-inkwell JIT backend, in migration. Currently not wired
# into the dispatch path — feature just pulls the dep so SDL builds
# end-to-end. Build env needs LLVM_SYS_181_PREFIX=/usr/lib/llvm-18.
dynarec_llvm = ["rustboyadvance-core/dynarec_llvm"]
# Per-shape execution-count profiler, gated through to the arm7tdmi
# crate. When on, the SDL frontend dumps the counter table at replay
# exit so the measure harness can retrain `W_*` weights from real
# gameplay. See docs/dynarec-arm64-program.md.
shape_profile = ["rustboyadvance-core/shape_profile", "dynarec"]